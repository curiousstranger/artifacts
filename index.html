<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artifacts</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
      padding: 3rem 1.5rem;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 3rem;
    }

    h1 {
      font-size: 1.875rem;
      font-weight: 700;
      color: #0f172a;
    }

    header p {
      margin-top: 0.5rem;
      color: #64748b;
      font-size: 0.95rem;
    }

    .artifact-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .artifact-card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 0.75rem;
      padding: 1.25rem 1.5rem;
      text-decoration: none;
      color: inherit;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: box-shadow 0.15s, border-color 0.15s;
    }

    .artifact-card:hover {
      border-color: #93c5fd;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.1);
    }

    .artifact-info h2 {
      font-size: 1rem;
      font-weight: 600;
      color: #0f172a;
    }

    .artifact-info p {
      margin-top: 0.25rem;
      font-size: 0.85rem;
      color: #64748b;
    }

    .arrow {
      color: #94a3b8;
      font-size: 1.25rem;
      flex-shrink: 0;
      margin-left: 1rem;
    }

    footer {
      margin-top: 4rem;
      font-size: 0.8rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Artifacts</h1>
      <p>A collection of interactive tools and calculators.</p>
    </header>

    <div class="artifact-list">
      <a href="housing-calculator.html" class="artifact-card">
        <div class="artifact-info">
          <h2>Housing Affordability Calculator</h2>
          <p>Estimate what you can afford to rent or buy based on income, DTI, and the 30% rule.</p>
        </div>
        <span class="arrow">→</span>
      </a>
    </div>

    <footer>
      <p>Built with Claude.</p>
    </footer>
  </div>
</body>
</html>
